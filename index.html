<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS Mission Planner</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- Full Screen Map -->
    <div id="map"></div>

    <!-- UI Overlay: Header -->
    <div class="overlay-header">
        <h1 class="logo">ATLAS <span class="highlight">PRIME</span></h1>
        <div class="status-badge" id="connection-status">
            <span class="dot"></span> Online
        </div>
    </div>

    <!-- UI Overlay: Mission Controls (Left Panel) -->
    <div class="overlay-panel left-panel">
        <div class="panel-header">
            <i class="ph ph-crosshair"></i>
            <h2>Mission Control</h2>
        </div>

        <button id="btn-locate" class="btn btn-locate secondary">
            <i class="ph ph-navigation-arrow"></i> Locate Me
        </button>

        <div class="control-group">
            <button id="btn-draw" class="btn primary">
                <i class="ph ph-map-pin-plus"></i> Add Waypoints
            </button>
            <button id="btn-clear" class="btn secondary">
                <i class="ph ph-trash"></i> Clear
            </button>
        </div>

        <div class="mission-stats">
            <div class="stat-item">
                <span class="label">Distance</span>
                <span class="value" id="total-distance">0.00 km</span>
            </div>
            <div class="stat-item">
                <span class="label">Est. Time</span>
                <span class="value" id="est-time">0 min</span>
            </div>
        </div>

        <div class="action-buttons">

            <button id="btn-save" class="btn success">
                <i class="ph ph-floppy-disk"></i> Save Mission
            </button>
        </div>

        <div id="ai-feedback" class="ai-feedback hidden">
            <!-- AI Logic output will go here -->
        </div>
    </div>

    <!-- UI Overlay: Telemetry (Right Panel) -->
    <div class="overlay-panel right-panel">
        <div class="panel-header">
            <i class="ph ph-chart-line-up"></i>
            <h2>Rover Telemetry</h2>
        </div>

        <div class="telemetry-grid">
            <div class="telemetry-card">
                <i class="ph ph-battery-charging icon"></i>
                <div class="telemetry-data">
                    <span class="label">Battery</span>
                    <span class="value" id="rover-battery">--%</span>
                </div>
            </div>
            <div class="telemetry-card">
                <i class="ph ph-wifi-high icon"></i>
                <div class="telemetry-data">
                    <span class="label">Signal</span>
                    <span class="value" id="rover-signal">-- dBm</span>
                </div>
            </div>
            <div class="telemetry-card">
                <i class="ph ph-compass icon"></i>
                <div class="telemetry-data">
                    <span class="label">Heading</span>
                    <span class="value" id="rover-heading">--°</span>
                </div>
            </div>
            <div class="telemetry-card status-card">
                <span class="label">Status</span>
                <span class="value status-text" id="rover-status">DISCONNECTED</span>
            </div>
        </div>

        <div class="coords-display">
            <p>LAT: <span id="rover-lat">0.000000</span></p>
            <p>LNG: <span id="rover-lng">0.000000</span></p>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Leaflet PolylineDecorator -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-polylinedecorator/1.6.0/leaflet.polylineDecorator.min.js"></script>

    <!-- App Scripts -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
